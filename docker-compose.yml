# ---------------------------------------------------------------------------
#  Resin Print Queue — plug & play stack
#
#    docker compose up -d --build        -> http://localhost:8080
#
#  Aucun fichier .env n'est nécessaire pour démarrer : les identifiants des
#  boutiques, les crons et les listes UV / commentaires se saisissent ensuite
#  dans la page « Intégrations » du dashboard (stockés en base).
#
#  Mettre à jour depuis GitHub (dépôt privé OK, données conservées) :
#    dashboard > Intégrations > Mises à jour (token, bouton, mode auto)
#    ou, en ligne de commande : sh scripts/update.sh
#
#  Vider la production (commandes + pièces) :
#    docker compose exec app node scripts/reset-data.js --yes
#
#  ⚠ Ne JAMAIS lancer « docker compose down -v » : -v supprime le volume
#    rpq-data, donc la base et ses sauvegardes.
# ---------------------------------------------------------------------------

x-app-env: &app-env
  NODE_ENV: production
  TZ: ${TZ:-America/Toronto}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_PATH: /data/printer-queue.db
  DASHBOARD_USER: ${DASHBOARD_USER:-admin}
  DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
  APP_URL: ${APP_URL:-}
  SYNC_CRON: ${SYNC_CRON:-*/5 * * * *}
  SHIPMENT_CRON: ${SHIPMENT_CRON:-*/15 * * * *}
  SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-14}
  SHOPIFY_SHOP_DOMAIN: ${SHOPIFY_SHOP_DOMAIN:-}
  SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
  SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
  SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-read_orders}
  SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
  SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2024-10}
  ETSY_SHOP_ID: ${ETSY_SHOP_ID:-}
  ETSY_API_KEY: ${ETSY_API_KEY:-}
  ETSY_ACCESS_TOKEN: ${ETSY_ACCESS_TOKEN:-}
  CHITCHATS_CLIENT_ID: ${CHITCHATS_CLIENT_ID:-}
  CHITCHATS_ACCESS_TOKEN: ${CHITCHATS_ACCESS_TOKEN:-}
  CHITCHATS_API_BASE: ${CHITCHATS_API_BASE:-https://chitchats.com/api/v1}
  CHITCHATS_WEBHOOK_SECRET: ${CHITCHATS_WEBHOOK_SECRET:-}
  SHIP_ALL_PARTS_ON_SHIPMENT: ${SHIP_ALL_PARTS_ON_SHIPMENT:-true}
  BACKUP_KEEP: ${BACKUP_KEEP:-10}

services:
  # ---- Dashboard + API (sert aussi le front-end statique) ------------------
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: resin-print-queue:latest
    container_name: rpq-app
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - pq-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Worker : cron des commandes (5 min) + réconciliation Chit Chats ----
  worker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: resin-print-queue:latest
    container_name: rpq-worker
    restart: unless-stopped
    command: ["node", "src/jobs/worker.js"]
    environment: *app-env
    # le healthcheck de l'image interroge le port HTTP, que le worker n'ouvre pas
    healthcheck:
      disable: true
    volumes:
      - pq-data:/data
    depends_on:
      app:
        condition: service_healthy

  # ---- Mises à jour depuis GitHub ------------------------------------------
  # Exécute les demandes du dashboard (Intégrations > Mises à jour : bouton
  # « Mettre à jour », token, mise à jour automatique) via scripts/update.sh :
  # sauvegarde -> pull -> rebuild -> redémarrage, avec retour arrière si l'app
  # ne redevient pas saine. A accès au socket Docker de l'hôte (nécessaire pour
  # reconstruire l'image) ; l'app, elle, n'y a pas accès.
  updater:
    image: docker:27-cli
    container_name: rpq-updater
    restart: unless-stopped
    working_dir: /repo
    environment:
      RPQ_STATUS_DIR: /data/updater
      # valeurs par défaut : celles saisies dans le dashboard sont prioritaires
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-3dkeycap/Printer-Queue-public}
      UPDATE_BRANCH: ${UPDATE_BRANCH:-main}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-10}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
      - pq-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp scripts/updater.sh /tmp/updater.sh && exec sh /tmp/updater.sh"]

volumes:
  pq-data:
    name: rpq-data
