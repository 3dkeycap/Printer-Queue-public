<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Resin Queue</title>
    <style>
      body { font: 14px system-ui, -apple-system, sans-serif; color: #10203d; margin: 0; width: 300px; background: #f4f7fd; }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #dfe6f3; }
      header strong { font-size: 14px; }
      header span { margin-left: auto; font-size: 11px; color: #7083a3; }
      main { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .order { font-size: 12px; color: #4a5d80; }
      .order b { font-size: 18px; color: #10203d; display: block; margin-top: 2px; }
      .big { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 0; border-radius: 10px; background: #1f5fd6; color: #fff; font: 600 15px system-ui; cursor: pointer; }
      .big[disabled] { background: #b8c6e2; cursor: default; }
      .hint { font-size: 12px; color: #5b6c8c; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4a5d80; }
      .dot { width: 8px; height: 8px; border-radius: 99px; background: #c7cfdd; }
      footer { display: flex; gap: 8px; padding: 0 14px 14px; }
      footer button { flex: 1; padding: 8px; border: 1px solid #ccd6e8; border-radius: 8px; background: #fff; color: #10203d; font: 600 12px system-ui; cursor: pointer; }
      #update.available { background: #fff4d6; border-color: #e3c56c; }
    </style>
  </head>
  <body>
    <header><img src="icon32.png" width="22" height="22" alt="" /><strong>Resin Queue</strong><span id="version"></span></header>
    <main>
      <div class="order" id="order">Ouvre une commande dans l'admin Shopify.</div>
      <button class="big" id="open" disabled>Ouvrir sur Chit Chats</button>
      <p class="hint" id="hint"></p>
      <div class="status"><span class="dot" id="dot"></span><span id="status">…</span></div>
    </main>
    <footer>
      <button id="settings">Réglages</button>
      <button id="update">Mettre à jour</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
